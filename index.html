<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방문간호 일정관리</title>
<style>
  :root{
    --bg: #101319;
    --surface: #181c24;
    --surface2: #1f2430;
    --line: #2a2f3a;
    --text: #eceef2;
    --text-dim: #8b91a0;
    --accent: #4fb3a9;
    --danger: #e0575a;
    --sun: #ff6b7a;
    --sat: #5b8cff;
    --facility: #e0a83d;
    --visit: #3d8ee0;
    --holiday: #ff6b7a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"]{
    --bg: #f5f6f9;
    --surface: #ffffff;
    --surface2: #eef0f4;
    --line: #dde1e8;
    --text: #1b1e24;
    --text-dim: #6b7280;
    --accent: #1f8f7e;
    --danger: #d1373a;
    --sun: #e11d48;
    --sat: #2563eb;
    --facility: #c98a1f;
    --visit: #2f6fb0;
    --holiday: #e11d48;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---- compact header ---- */
  header{
    flex:0 0 auto;
    background:var(--bg);
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px;
    border-bottom:1px solid var(--line);
  }
  .title-row{display:flex;align-items:center;gap:5px;}
  .title-row button{background:none;border:none;color:var(--text-dim);font-size:18px;padding:4px 6px;cursor:pointer;line-height:1;}
  .title-row h1{font-size:14.5px;font-weight:700;margin:0;text-align:center;cursor:pointer;white-space:nowrap;flex-shrink:0;}
  .icon-btn{background:var(--surface2);border:1px solid var(--line);border-radius:14px;font-size:12px;padding:5px 7px;cursor:pointer;color:var(--text);flex-shrink:0;}
  .legend{display:flex;gap:7px;flex:1;justify-content:center;font-size:10.5px;color:var(--text-dim);overflow:hidden;}
  .legend span{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 4px 2px;font-size:11px;color:var(--text-dim);}
  .weekdays div{text-align:center;padding:1px 0;}
  .weekdays div:first-child{color:var(--sun);}
  .weekdays div:last-child{color:var(--sat);}

  /* ---- calendar grid ---- */
  #grid{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:1px;
    background:var(--line);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    min-height:0;
  }
  .day{
    background:var(--bg);
    padding:4px 4px 3px;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:1px;
    overflow:hidden;
    min-height:0;
  }
  .day.other{opacity:.35;}
  .day.holiday{background:rgba(255,107,122,.12);}
  .day.selected{box-shadow:inset 0 0 0 2px var(--accent);}
  .daynum-row{display:flex;align-items:center;gap:4px;flex-shrink:0;height:16px;}
  .daynum{font-size:12px;font-weight:600;color:var(--text-dim);flex-shrink:0;}
  .day.today .daynum{background:var(--accent);color:#0c1210;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;}
  .day.sun .daynum{color:var(--sun);}
  .day.sat .daynum{color:var(--sat);}
  .holiday-badge{font-size:9px;line-height:1;color:var(--holiday);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .entry{font-size:10.5px;line-height:1.3;padding:1px 4px;border-radius:3px;color:#0c0e12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .entry .rep-mark{font-size:8px;opacity:.75;}
  .more{font-size:9px;color:var(--text-dim);padding:0 4px;flex-shrink:0;}
  /* ---- bottom panel (docked, always visible) ---- */
  #bottomPanel{
    flex:0 0 30%;
    display:flex;
    flex-direction:column;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    min-height:0;
  }
  .panel-header{display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;margin-bottom:4px;}
  .panel-date{font-size:16px;font-weight:800;}
  .panel-meta{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .panel-holiday{font-size:12px;color:var(--holiday);font-weight:700;}
  #panelList{flex:1 1 auto;overflow-y:auto;min-height:0;}
  .entry-row{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:6px 0;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface2);box-shadow:0 2px 7px rgba(0,0,0,.08);}
  .entry-row .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .entry-row .info{flex:1;font-size:14px;line-height:1.35;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-row .info .label{font-weight:700;}
  .entry-row .info .sub{color:var(--text-dim);font-size:12px;margin-left:6px;}
  .entry-row .info .time{display:inline-block;color:var(--accent);font-weight:800;margin-right:7px;}
  .entry-row .info .memo{display:block;color:var(--text-dim);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-row button{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text-dim);font-size:12px;padding:6px 8px;flex-shrink:0;}
  .empty-hint{color:var(--text-dim);font-size:13px;padding:18px 10px;text-align:center;border:1px dashed var(--line);border-radius:12px;margin-top:8px;}
  .panel-add{flex-shrink:0;margin-top:8px;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#0c1210;}

  /* ---- sheets (modal forms) ---- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:30;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;}
  .sheet h2{font-size:16px;margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .time-range-row{display:flex;align-items:flex-start;gap:7px;}
  .time-wheel-control{flex:1;min-width:0;}
  .time-wheel-title{font-size:11px;color:var(--text-dim);font-weight:700;margin:0 0 5px 2px;}
  .time-wheel-line{display:flex;align-items:center;justify-content:center;gap:3px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:5px 6px;}
  .hour-select{width:58px!important;flex:0 0 58px!important;padding:8px 4px!important;text-align:center;border:none!important;background:transparent!important;}
  .time-unit{font-size:13px;color:var(--text-dim);font-weight:700;flex-shrink:0;}
  .minute-wheel-wrap{height:126px;width:48px;overflow:hidden;border-radius:8px;background:var(--surface);border:1px solid var(--line);}
  .minute-wheel{height:126px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .minute-wheel::-webkit-scrollbar{display:none;}
  .minute-option{height:42px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:15px;font-weight:700;color:var(--text-dim);cursor:pointer;}
  .minute-option.selected{color:var(--text);font-weight:900;background:var(--surface2);}
  .time-range-sep{font-weight:800;color:var(--text-dim);font-size:16px;padding-top:31px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}

  .type-toggle{display:flex;gap:8px;}
  .type-pill{flex:1;text-align:center;padding:12px 8px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid transparent;color:#0c0e12;}
  .type-pill.selected{border-color:var(--text);}
  .type-pill.facility{background:var(--facility);}
  .type-pill.visit{background:var(--visit);}

  .seg-toggle{display:flex;background:var(--surface2);border-radius:10px;padding:3px;}
  .seg-toggle button{flex:1;padding:9px;border:none;background:none;color:var(--text-dim);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .seg-toggle button.active{background:var(--accent);color:#0c1210;}

  .weekday-picker{display:flex;gap:6px;justify-content:space-between;}
  .wd-btn{flex:1;aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .wd-btn.active{background:var(--accent);color:#0c1210;border-color:var(--accent);}

  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.save{background:var(--accent);color:#0c1210;}
  .btn.cancel{background:var(--surface2);color:var(--text);}
  .btn.delete{background:transparent;color:var(--danger);}
  .hint{font-size:11.5px;color:var(--text-dim);margin-top:6px;}

  .jump-row{display:flex;gap:10px;}
  .jump-row .field{flex:1;margin-bottom:0;}

  .confirm-box{background:var(--surface);width:100%;max-width:360px;border-radius:16px;padding:20px;text-align:center;}
  .confirm-box p{font-size:15px;margin:0 0 16px;color:var(--text);}

  /* iPhone/Safari long-press friendly calendar cells */
  .day{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .day.long-pressing{box-shadow:inset 0 0 0 2px var(--accent);}

  .color-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .color-btn{height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer;position:relative;}
  .color-btn.selected{border-color:var(--text);}
  .color-btn.selected::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.65);}

  /* compact entry sheet */
  .sheet{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:82vh;}
  .sheet h2{font-size:15px;margin:0 0 10px;}
  .field{margin-bottom:9px;}
  .field label{font-size:11px;margin-bottom:4px;}
  .type-toggle{gap:6px;}
  .type-pill{padding:9px 7px;font-size:13px;border-radius:9px;}
  .seg-toggle button{padding:7px;font-size:12px;}
  .time-range-row{gap:5px;}
  .time-wheel-title{font-size:10px;margin:0 0 3px 2px;}
  .time-wheel-line{gap:2px;border-radius:9px;padding:3px 4px;}
  .hour-select{width:50px!important;flex-basis:50px!important;padding:6px 2px!important;font-size:13px!important;}
  .time-unit{font-size:11px;}
  .minute-wheel-wrap{height:84px;width:42px;border-radius:7px;}
  .minute-wheel{height:84px;}
  .minute-option{height:28px;font-size:13px;}
  .time-range-sep{font-size:14px;padding-top:23px;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{padding:8px 10px;font-size:14px;border-radius:8px;}
  .field textarea{min-height:46px;}
  .color-picker{gap:6px;}
  .color-btn{height:29px;border-radius:7px;}
  .weekday-picker{gap:4px;}
  .btn-row{gap:7px;margin-top:4px;}
  .btn{padding:10px;font-size:14px;border-radius:9px;}
  .hint{font-size:10px;margin-top:4px;}


  /* ===== Modern UI refresh ===== */
  :root{
    --bg:#0b1117; --surface:#111a22; --surface2:#17232d; --line:#253541;
    --text:#eef7f5; --text-dim:#8ea3aa; --accent:#45d0b1; --accent-2:#2ba58e;
    --danger:#ff6b72; --sun:#ff7380; --sat:#70a7ff;
    --facility:#f1b84b; --visit:#4aa7f5; --holiday:#ff7380;
    --shadow:0 12px 30px rgba(0,0,0,.22);
  }
  :root[data-theme="light"]{
    --bg:#f3f8f7; --surface:#ffffff; --surface2:#edf5f3; --line:#d8e6e2;
    --text:#162522; --text-dim:#70827f; --accent:#169f86; --accent-2:#117d6a;
    --danger:#d93e4a; --sun:#e54861; --sat:#2f70d8; --facility:#d28c16; --visit:#347fc4; --holiday:#e54861;
    --shadow:0 10px 26px rgba(25,68,61,.10);
  }
  body{background:radial-gradient(circle at 50% -10%, rgba(69,208,177,.10), transparent 35%),var(--bg);}
  header{background:rgba(11,17,23,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);padding-top:calc(env(safe-area-inset-top,0px) + 9px);}
  :root[data-theme="light"] header{background:rgba(243,248,247,.90);}
  .title-row h1{font-size:16px;letter-spacing:-.35px;font-weight:800;position:relative;line-height:30px;padding:0 10px;color:var(--text);}
  .title-row h1::after{content:"VISIT NURSING  ·  SCHEDULE";display:block;font-size:6.5px;letter-spacing:1.7px;line-height:7px;color:var(--text-dim);font-weight:800;margin-top:-5px;opacity:.72;}
  .title-row button:not(.icon-btn){font-size:22px;width:30px;height:30px;border-radius:10px;background:var(--surface2);color:var(--text);padding:0;}
  .icon-btn{border-radius:11px;border:1px solid var(--line);background:var(--surface2);padding:6px 8px;font-weight:700;}
  .legend{font-weight:600;}
  .weekdays{padding:7px 5px 4px;font-weight:700;}
  #grid{gap:2px;background:transparent;border:0;padding:2px 3px 3px;}
  .day{border-radius:9px;background:var(--surface);padding:5px 4px 4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);}
  :root[data-theme="light"] .day{box-shadow:inset 0 0 0 1px rgba(20,70,60,.035);}
  .day.holiday{background:linear-gradient(180deg,rgba(255,115,128,.11),var(--surface));}
  .day.selected{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 1px rgba(69,208,177,.14);}
  .day.today .daynum{box-shadow:0 3px 8px rgba(69,208,177,.24);}
  .entry{border-radius:4px;padding:1px 3px;font-size:9px;line-height:1.05;min-height:12px;box-shadow:0 1px 4px rgba(0,0,0,.10);}
  .more{font-weight:700;}
  #bottomPanel{flex-basis:31%;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--accent) 12%));border-top:1px solid var(--line);padding:11px 13px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.10);}
  .panel-header{margin-bottom:6px;align-items:center;}
  .panel-title-wrap{min-width:0;}
  .panel-date-line{display:flex;align-items:center;gap:7px;}
  .panel-date{font-size:17px;letter-spacing:-.3px;}
  .panel-today-badge{font-size:9px;font-weight:900;letter-spacing:.6px;color:#06251e;background:var(--accent);border-radius:20px;padding:3px 6px;}
  .panel-meta{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:11px;}
  .panel-dot{opacity:.5;}
  .panel-right-meta{display:flex;align-items:center;gap:8px;}
  .panel-holiday{font-size:11px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .panel-add-mini{width:34px;height:34px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06251e;font-size:20px;font-weight:800;box-shadow:0 5px 14px rgba(69,208,177,.20);}
  .panel-divider{height:1px;background:var(--line);margin:0 0 3px;}
  #panelList{padding:0 1px 2px;}
  .entry-row{gap:9px;padding:9px 9px;margin:6px 0;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:13px;background:linear-gradient(135deg,var(--surface2),color-mix(in srgb,var(--surface2) 90%,var(--accent) 10%));box-shadow:var(--shadow);}
  .entry-row .swatch{width:8px;height:8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent);}
  .entry-row .info{font-size:13px;}
  .entry-row .info .time{font-size:12px;padding:3px 6px;border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,transparent);margin-right:6px;}
  .entry-row .info .sub{font-size:11px;}
  .entry-row .info .memo{font-size:11px;margin-top:2px;}
  .entry-row button{border-radius:9px;background:var(--surface);padding:6px 7px;font-size:11px;}
  .empty-hint{margin:7px 0 0;padding:14px 10px;background:var(--surface2);}
  .sheet-backdrop{background:rgba(2,8,12,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
  .sheet{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--accent) 8%));max-width:520px;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 45px rgba(0,0,0,.28);}
  .sheet:before{content:"";display:block;width:38px;height:4px;border-radius:10px;background:var(--line);margin:0 auto 11px;}
  .sheet h2{font-size:17px;margin:0 0 11px;letter-spacing:-.3px;}
  .field{margin-bottom:10px;}
  .field label{font-weight:700;margin-bottom:5px;}
  .type-toggle{gap:7px;}
  .type-pill{padding:10px 8px;border-radius:12px;}
  .seg-toggle{border:1px solid var(--line);}
  .weekday-picker{gap:5px;}
  .wd-btn{font-size:12px;}
  .field input[type=text],.field input[type=date],.field select,.field textarea{border-radius:10px;padding:9px 10px;}
  .field textarea{min-height:50px;}
  .btn-row{gap:8px;margin-top:5px;}
  .btn{padding:11px;border-radius:11px;}
  .btn.save{box-shadow:0 7px 16px rgba(69,208,177,.18);}
  @media (max-width:390px){
    .legend{display:none;} .title-row{gap:4px;} .icon-btn{padding:6px 7px;}
.day{padding:3px 2px;} .entry{font-size:8.5px;line-height:1.02;min-height:11px;padding:1px 3px;}
    #bottomPanel{padding-left:10px;padding-right:10px;} .entry-row{padding:8px 7px;}
  }


  /* 그레이 모드 — 기존 스크린샷의 차분한 차콜/그레이 계열을 그대로 유지 */
  :root[data-theme="gray"]{
    --bg:#292b2e; --surface:#303235; --surface2:#36383b; --line:#424448;
    --text:#eeeae2; --text-dim:#aaa7a1; --accent:#c8a873; --accent-2:#9f8153;
    --danger:#cf7773; --sun:#d27b78; --sat:#6f91a8;
    --facility:#e5aa35; --visit:#72b8ad; --holiday:#d27b78;
    --shadow:0 10px 26px rgba(0,0,0,.22);
  }
  :root[data-theme="gray"] body{
    background:linear-gradient(180deg,#292b2e 0%,#252729 100%);
  }
  :root[data-theme="gray"] header{
    background:rgba(42,44,47,.96);
    border-bottom-color:#3d3f43;
    box-shadow:0 4px 16px rgba(0,0,0,.16);
  }
  :root[data-theme="gray"] .title-row h1{color:#e9e5dd;}
  :root[data-theme="gray"] .title-row h1::after{color:#aaa59b;}
  :root[data-theme="gray"] .title-row button:not(.icon-btn){
    background:#333538; color:#ddd9d1; border:1px solid #414347;
  }
  :root[data-theme="gray"] .icon-btn{
    background:#333538; border-color:#414347; color:#e4dfd6;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  :root[data-theme="gray"] .day{
    background:#2d3032;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 2px 7px rgba(0,0,0,.10);
  }
  :root[data-theme="gray"] .day.holiday{
    background:linear-gradient(180deg,rgba(210,123,120,.10),#2d3032);
  }
  :root[data-theme="gray"] .day.today .daynum{
    box-shadow:0 3px 8px rgba(200,168,115,.25);
  }
  :root[data-theme="gray"] .day.selected{
    box-shadow:inset 0 0 0 2px #c8a873,0 0 0 1px rgba(200,168,115,.18);
  }
  :root[data-theme="gray"] #bottomPanel{
    background:linear-gradient(180deg,#303235,#292b2e);

(function(){

  // ---------- Phone back button / history ----------
  // Keep the PWA open: Back first closes the current sheet/dialog,
  // and only moves through app states instead of exiting immediately.
  let appHistoryDepth = 0;
  let syncingAppHistory = false;
  let handlingPopstate = false;
  history.replaceState({ app: true, depth: 0 }, '', location.href);
  function pushAppHistory(){
    appHistoryDepth++;
    history.pushState({ app: true, depth: appHistoryDepth }, '', location.href);
  }
  function consumeAppHistory(){
    if(handlingPopstate) return;
    if(appHistoryDepth > 0){
      syncingAppHistory = true;
      history.back();
    }
  }
  function closeTopAppLayer(){
    const confirm = document.getElementById('confirmBackdrop');
    const entry = document.getElementById('entryBackdrop');
    const jump = document.getElementById('jumpBackdrop');
    if(confirm && confirm.classList.contains('open')){
      if(typeof confirm._closeForBack === 'function') confirm._closeForBack();
      else confirm.classList.remove('open');
      confirmBtns && (confirmBtns.style.display='flex');
      return true;
    }
    if(entry && entry.classList.contains('open')){ entry.classList.remove('open'); return true; }
    if(jump && jump.classList.contains('open')){ jump.classList.remove('open'); return true; }
    return false;
  }
  window.addEventListener('popstate', ()=>{
    if(syncingAppHistory){
      syncingAppHistory = false;
      appHistoryDepth = Math.max(0, appHistoryDepth - 1);
      return;
    }
    if(closeTopAppLayer()){
      handlingPopstate = true;
      appHistoryDepth = Math.max(0, appHistoryDepth - 1);
      handlingPopstate = false;
      return;
    }
    // No app layer is open. Keep one history entry so Back does not exit the PWA.
    history.pushState({ app: true, depth: appHistoryDepth }, '', location.href);
  });
  function closeLayerWithHistory(el){
    el.classList.remove('open');
    consumeAppHistory();

  function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  const TYPE_COLOR = { facility: getCss('--facility'), visit: getCss('--visit') };

  function loadJSON(key, fallback){

          singles: loadJSON(SINGLE_KEY,{}),

      '2027-07-17':'제헌절',
      '2027-08-15':'광복절','2027-08-16':'대체공휴일',
      '2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
      '2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일',
      '2027-12-25':'크리스마스','2027-12-27':'대체공휴일'
    }
  };
  const FIXED_ANNUAL = {
    '01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일',
    '08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'크리스마스'
  };
  function getHoliday(y,m,d){
    const key = dkey(y,m,d);
    if(YEAR_HOLIDAYS[y]) return YEAR_HOLIDAYS[y][key] || null;
    const mmdd = pad(m+1)+'-'+pad(d);
    if(mmdd==='07-17' && y>=2026) return '제헌절';
    return FIXED_ANNUAL[mmdd] || null;
  }

  // singles: { 'YYYY-MM-DD': [ {id,type,memo} ] }
  // recurring: [ {id,type,memo,days:[0..6],start:'YYYY-MM-DD',end:'YYYY-MM-DD'|null} ]
  let singles = loadJSON(SINGLE_KEY, null);
  let recurring = loadJSON(RECUR_KEY, null);

  // 앱 버전 업데이트 시 일정 자동 복구
  // 같은 기기/같은 브라우저의 PWA 업데이트는 localStorage가 유지되지만,
  // 데이터 저장키가 바뀌거나 한쪽 키가 비어 있는 경우를 대비해 내부 자동백업에서 복구합니다.
  (function restoreAutoBackup(){
    if(singles !== null && recurring !== null) return;
    try{
      const raw=localStorage.getItem(AUTO_BACKUP_KEY);
      if(!raw) return;
      const payload=JSON.parse(raw);
      if(payload && payload.backupFormat==='bangmun-ganho-auto' && payload.singles && Array.isArray(payload.recurring)){
        if(singles===null) singles=payload.singles;
        if(recurring===null) recurring=payload.recurring;
        localStorage.setItem(SINGLE_KEY,JSON.stringify(singles));
        localStorage.setItem(RECUR_KEY,JSON.stringify(recurring));
      }
    }catch(e){}
    if(singles===null) singles={};
    if(recurring===null) recurring=[];
  })();

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedKey = dkey(today.getFullYear(), today.getMonth(), today.getDate());

  const monthLabel = document.getElementById('monthLabel');
  const grid = document.getElementById('grid');

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dkey(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }
  function toDate(key){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }

  function typeLabel(type){ return type==='facility' ? '요양간호' : '방문간호'; }
  function entryTitle(ent){ return typeLabel(ent.type); }
  function getEndMinutes(ent){ return (ent.endHour===null || ent.endHour===undefined || ent.endHour==='') ? null : normalizeMinutes(ent.endHour); }
  function normalizeMinutes(h){
    if(h===null || h===undefined || h==='') return null;
    const n = Number(h);
    if(!Number.isFinite(n)) return null;
    // 기존 저장값(0~23)은 정각 시간으로 보고, 새 저장값은 분 단위로 처리합니다.
    return n <= 23 ? n * 60 : n;
  }
  function formatHour(h){
    const mins = normalizeMinutes(h);
    if(mins===null) return '';
    const hh24 = Math.floor(mins / 60);
    const mm = mins % 60;
    const ampm = hh24 < 12 ? '오전' : '오후';
    let hh = hh24 % 12; if(hh===0) hh = 12;
    return ampm + ' ' + hh + ':' + String(mm).padStart(2,'0');
  }
  function sortByHour(list){
    return list.slice().sort((a,b)=>{
      const ha = (a.hour===null || a.hour===undefined) ? 99 : a.hour;
      const hb = (b.hour===null || b.hour===undefined) ? 99 : b.hour;
      return ha - hb;
    });
  }

  function occurrencesForDate(y,m,d){
    const key = dkey(y,m,d);
    const list = [];
    (singles[key]||[]).forEach(e => list.push(Object.assign({}, e, {key, recurring:false})));
    const dow = new Date(y,m,d).getDay();
    const dateObj = new Date(y,m,d); dateObj.setHours(0,0,0,0);
    recurring.forEach(r=>{
      if(!r.days.includes(dow)) return;
      if(Array.isArray(r.skip) && r.skip.includes(key)) return;
      if(r.start){ const s = toDate(r.start); s.setHours(0,0,0,0); if(dateObj < s) return; }
      if(r.end){ const en = toDate(r.end); en.setHours(0,0,0,0); if(dateObj > en) return; }
      list.push({id:r.id, type:r.type, memo:r.memo, color:r.color, hour:r.hour, endHour:r.endHour, key, recurring:true, ruleId:r.id});
    });
    return sortByHour(list);
  }

  function render(){
    monthLabel.textContent = viewYear + '년 ' + (viewMonth+1) + '월';
    grid.innerHTML = '';

    const firstDow = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const cells = [];
    for(let i=firstDow-1; i>=0; i--) cells.push({d: daysInPrevMonth-i, other:true, m:viewMonth-1});
    for(let d=1; d<=daysInMonth; d++) cells.push({d, other:false, m:viewMonth});
    let next=1;
    while(cells.length % 7 !== 0) cells.push({d:next++, other:true, m:viewMonth+1});

    grid.style.gridTemplateRows = 'repeat(' + (cells.length/7) + ',1fr)';

    cells.forEach((cell, idx) => {
      const norm = new Date(viewYear, cell.m, cell.d);
      const y=norm.getFullYear(), m=norm.getMonth(), d=norm.getDate();
      const dow = idx % 7;
      const key = dkey(y,m,d);
      const holidayName = getHoliday(y,m,d);

      const div = document.createElement('div');
      div.className = 'day' + (cell.other?' other':'') + (dow===0?' sun':'') + (dow===6?' sat':'') + (holidayName?' holiday':'');
      if(norm.toDateString()===today.toDateString()) div.className += ' today';
      if(key===selectedKey) div.className += ' selected';

      const row = document.createElement('div');
      row.className='daynum-row';
      const numEl = document.createElement('div');
      numEl.className='daynum'; numEl.textContent = d;
      row.appendChild(numEl);
      if(holidayName){
        const h = document.createElement('div');
        h.className='holiday-badge';
        h.textContent = holidayName;
        row.appendChild(h);
      }
      div.appendChild(row);

      const list = occurrencesForDate(y,m,d);
      const maxShow = 5;
      list.slice(0,maxShow).forEach(ent=>{
        const e = document.createElement('div');
        e.className='entry';
        e.style.background = ent.color || TYPE_COLOR[ent.type];
        const text = ent.memo && ent.memo.trim() ? ent.memo.trim() : entryTitle(ent);
        e.textContent = text;
        div.appendChild(e);
      });
      if(list.length>maxShow){
        const more=document.createElement('div');
        more.className='more'; more.textContent='+'+(list.length-maxShow);
        div.appendChild(more);
      }

      let longPressTimer = null;
      let longPressTriggered = false;
      let pressStartX = 0, pressStartY = 0;

      const cancelLongPress = ()=>{
        if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
        div.classList.remove('long-pressing');
      };

      const startLongPress = (x, y)=>{
        cancelLongPress();
        pressStartX = x; pressStartY = y;
        longPressTriggered = false;
        div.classList.add('long-pressing');
        longPressTimer = setTimeout(()=>{
          longPressTimer = null;
          longPressTriggered = true;
          div.classList.remove('long-pressing');
          selectedKey = key;
          openEntrySheet(key, null);
        }, 650);
      };

      div.addEventListener('touchstart', e=>{
        if(e.touches.length !== 1) return;
        const t=e.touches[0];
        startLongPress(t.clientX,t.clientY);
      }, {passive:true});

      div.addEventListener('touchmove', e=>{
        if(!longPressTimer || e.touches.length !== 1) return;
        const t=e.touches[0];
        if(Math.abs(t.clientX-pressStartX)>12 || Math.abs(t.clientY-pressStartY)>12) cancelLongPress();
      }, {passive:true});

      div.addEventListener('touchend', ()=>{
        const wasLong=longPressTriggered;
        cancelLongPress();
        if(!wasLong){ selectedKey=key; render(); }
        longPressTriggered=false;
      }, {passive:true});

      div.addEventListener('touchcancel', cancelLongPress, {passive:true});

      div.addEventListener('click', e=>{
        if(longPressTriggered){
          e.preventDefault();
          e.stopPropagation();
          longPressTriggered=false;
          return;
        }
        selectedKey=key;
        render();
      });

      grid.appendChild(div);
    });

    renderPanel();
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Bottom panel (auto-updates for the selected date) ----------
  const panelDate = document.getElementById('panelDate');
  const panelHoliday = document.getElementById('panelHoliday');
  const panelList = document.getElementById('panelList');
  const panelCount = document.getElementById('panelCount');
  const panelSummary = document.getElementById('panelSummary');
  const panelTodayBadge = document.getElementById('panelTodayBadge');

  function renderPanel(){
    const [y,m,d] = selectedKey.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const wd = ['일','월','화','수','목','금','토'][dt.getDay()];
    panelDate.textContent = m+'월 '+d+'일 ('+wd+')';
    const h = getHoliday(y, m-1, d);
    panelHoliday.textContent = h || '';

    panelList.innerHTML = '';
    const list = occurrencesForDate(y, m-1, d);
    panelCount.textContent = '일정 ' + list.length + '개';
    const visitCount = list.filter(e=>e.type==='visit').length;
    const facilityCount = list.filter(e=>e.type==='facility').length;
    if(panelSummary) panelSummary.textContent = '방문 ' + visitCount + ' · 요양 ' + facilityCount;
    if(panelTodayBadge) panelTodayBadge.style.display = dt.toDateString()===today.toDateString() ? 'inline-block' : 'none';
    if(list.length===0){
      const p=document.createElement('div');
      p.className='empty-hint'; p.textContent='등록된 일정이 없습니다.';
      panelList.appendChild(p);
      return;
    }
    list.forEach(ent=>{
      const row = document.createElement('div');
      row.className='entry-row';
      const startText = ent.hour!==null && ent.hour!==undefined ? formatHour(ent.hour) : '';
      const endText = getEndMinutes(ent)!==null ? formatHour(ent.endHour) : '';
      const timeText = startText ? (endText ? startText+' ~ '+endText : startText) : '';
      const timeHtml = timeText ? `<span class="time">${timeText}</span>` : '';
      row.style.borderLeftColor = ent.color || TYPE_COLOR[ent.type];
      row.innerHTML = `<div class="swatch" style="background:${ent.color || TYPE_COLOR[ent.type]}"></div>
        <div class="info">${timeHtml}<span class="label">${escapeHtml(entryTitle(ent))}</span>${ent.memo?`<span class="memo">${escapeHtml(ent.memo)}</span>`:''}</div>
        <button class="edit-btn" aria-label="일정 수정">수정</button>
        <button class="del-btn" aria-label="일정 삭제">삭제</button>`;
      row.querySelector('.edit-btn').addEventListener('click', ()=> openEntrySheet(ent.key, ent));
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        showConfirm('이 일정을 삭제할까요?', ()=>{
          if(ent.recurring){
            const rule = recurring.find(r=>r.id===ent.ruleId);
            if(rule){
              rule.skip = Array.isArray(rule.skip) ? rule.skip : [];
              if(!rule.skip.includes(ent.key)) rule.skip.push(ent.key);
              saveJSON(RECUR_KEY, recurring);
            }
          } else {
            const key = ent.key;
            singles[key] = (singles[key]||[]).filter(e2=>e2.id!==ent.id);
            if(singles[key].length===0) delete singles[key];
            saveJSON(SINGLE_KEY, singles);
          }
          render();
        });
      });
      panelList.appendChild(row);
    });
  }

  // ---------- Entry sheet ----------
  const entryBackdrop = document.getElementById('entryBackdrop');
  const entrySheetTitle = document.getElementById('entrySheetTitle');
  const typeToggle = document.getElementById('typeToggle');
  const repeatToggle = document.getElementById('repeatToggle');
  const weeklyField = document.getElementById('weeklyField');
  const weekdayPicker = document.getElementById('weekdayPicker');
  const repeatStart = document.getElementById('repeatStart');
  const repeatEnd = document.getElementById('repeatEnd');
  const entryMemo = document.getElementById('entryMemo');
  const entryHour = document.getElementById('entryHour');
  const entryEndHour = document.getElementById('entryEndHour');
  const entryHourHour = document.getElementById('entryHourHour');
  const entryEndHourHour = document.getElementById('entryEndHourHour');
  const entryHourMinute = document.getElementById('entryHourMinute');
  const entryEndHourMinute = document.getElementById('entryEndHourMinute');

  function buildHourSelect(select){
    select.innerHTML = '<option value="">--</option>';
    for(let h=8; h<=21; h++) select.insertAdjacentHTML('beforeend', `<option value="${pad(h)}">${h}</option>`);
  }
  function buildMinuteWheel(wheel){
    wheel.innerHTML = '';
    const top=document.createElement('div');
    top.className='minute-spacer';
    top.style.height='28px';
    wheel.appendChild(top);
    for(let m=0; m<60; m+=10){
      const d=document.createElement('div');
      d.className='minute-option';
      d.dataset.minute=pad(m);
      d.textContent=pad(m);
      wheel.appendChild(d);
    }
    const bottom=document.createElement('div');
    bottom.className='minute-spacer';
    bottom.style.height='28px';
    wheel.appendChild(bottom);
  }
  buildHourSelect(entryHourHour);
  buildHourSelect(entryEndHourHour);
  buildMinuteWheel(entryHourMinute);
  buildMinuteWheel(entryEndHourMinute);

  function setTimeUI(hidden, hourSelect, wheel, value){
    hidden.value = value || '';
    if(!value){
      hourSelect.value='';
      wheel.querySelectorAll('.minute-option').forEach(x=>x.classList.remove('selected'));
      wheel.scrollTop=0;
      return;
    }
    const mins=timeValueToMinutes(value);
    if(mins===null){ hourSelect.value=''; return; }
    const h=Math.floor(mins/60), m=mins%60;
    hourSelect.value=pad(h);
    const opt=[...wheel.children].find(x=>Number(x.dataset.minute)===m);
    wheel.querySelectorAll('.minute-option').forEach(x=>x.classList.toggle('selected',x===opt));
    if(opt) wheel.scrollTop=Math.max(0,opt.offsetTop - (wheel.clientHeight-opt.offsetHeight)/2);
  }
  function syncTimeUI(hidden, hourSelect, wheel){
    const h=hourSelect.value;
    const selected=wheel.querySelector('.minute-option.selected');
    hidden.value=(h && selected) ? h+':'+selected.dataset.minute : '';
  }
  function attachTimeUI(hidden, hourSelect, wheel){
    hourSelect.addEventListener('change',()=>syncTimeUI(hidden,hourSelect,wheel));
    wheel.addEventListener('click',e=>{
      const opt=e.target.closest('.minute-option');
      if(!opt) return;
      wheel.querySelectorAll('.minute-option').forEach(x=>x.classList.remove('selected'));
      opt.classList.add('selected');
      opt.scrollIntoView({block:'center',behavior:'smooth'});
      syncTimeUI(hidden,hourSelect,wheel);
    });
    let timer;
    wheel.addEventListener('scroll',()=>{
      clearTimeout(timer);
      timer=setTimeout(()=>{
        const center=wheel.scrollTop + wheel.clientHeight/2;
        let best=null,dist=Infinity;
        wheel.querySelectorAll('.minute-option').forEach(opt=>{
          const c=opt.offsetTop+opt.offsetHeight/2, d=Math.abs(c-center);
          if(d<dist){dist=d;best=opt;}
        });
        if(best){
          wheel.querySelectorAll('.minute-option').forEach(x=>x.classList.toggle('selected',x===best));
          syncTimeUI(hidden,hourSelect,wheel);
        }
      },80);
    },{passive:true});
  }
  attachTimeUI(entryHour,entryHourHour,entryHourMinute);
  attachTimeUI(entryEndHour,entryEndHourHour,entryEndHourMinute);
  const entryDeleteRow = document.getElementById('entryDeleteRow');
  const colorPicker = document.getElementById('colorPicker');

  function minutesToTimeValue(h){
    const mins = normalizeMinutes(h);
    if(mins===null) return '';
    const hh = Math.floor(mins/60);
    const mm = mins % 60;
    return pad(hh)+':'+pad(mm);
  }
  function timeValueToMinutes(v){
    if(!v) return null;
    const parts = v.split(':').map(Number);
    if(parts.length!==2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1])) return null;
    return parts[0]*60 + parts[1];
  }
  function validTenMinuteTime(v){
    if(!v) return true;
    const mins = timeValueToMinutes(v);
    return mins!==null && mins>=8*60 && mins<=21*60 && mins%10===0;
  }

  let selectedType = 'facility';
  let selectedColor = TYPE_COLOR.facility;
  let repeatMode = 'once';
  let selectedDays = new Set();
  let editingSingleId = null;
  let editingRuleId = null;
  let currentEntryDate = null;

  colorPicker.addEventListener('click', e=>{
    const b = e.target.closest('.color-btn');
    if(!b) return;
    selectedColor = b.dataset.color;
    renderColorPicker();
  });

  function renderColorPicker(){
    [...colorPicker.children].forEach(b=>{
      b.classList.toggle('selected', b.dataset.color.toLowerCase() === String(selectedColor).toLowerCase());
    });
  }

  typeToggle.addEventListener('click', e=>{
    const pill = e.target.closest('.type-pill');
    if(!pill) return;
    selectedType = pill.dataset.type;
    updateTypeUI();
  });
  function updateTypeUI(){
    [...typeToggle.children].forEach(p=> p.classList.toggle('selected', p.dataset.type===selectedType));
  }

  repeatToggle.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    repeatMode = btn.dataset.mode;
    updateRepeatUI();
  });
  function updateRepeatUI(){
    [...repeatToggle.children].forEach(b=> b.classList.toggle('active', b.dataset.mode===repeatMode));
    weeklyField.style.display = repeatMode==='weekly' ? 'block' : 'none';
  }

  weekdayPicker.addEventListener('click', e=>{
    const b = e.target.closest('.wd-btn');
    if(!b) return;
    const d = Number(b.dataset.d);
    if(selectedDays.has(d)) selectedDays.delete(d); else selectedDays.add(d);
    renderWeekdayPicker();
  });
  function renderWeekdayPicker(){
    [...weekdayPicker.children].forEach(b=> b.classList.toggle('active', selectedDays.has(Number(b.dataset.d))));
  }

  function openEntrySheet(dayKey, ent){
    currentEntryDate = dayKey;
    repeatStart.value = dayKey;
    repeatEnd.value = '';
    entryMemo.value = '';
    entryHour.value = '';
    entryEndHour.value = '';
    editingSingleId = null;
    editingRuleId = null;

    if(ent && ent.recurring){
      entrySheetTitle.textContent = '반복 일정 수정';
      const rule = recurring.find(r=>r.id===ent.ruleId);
      selectedType = rule.type;
      selectedColor = rule.color || TYPE_COLOR[rule.type];
      entryMemo.value = rule.memo || '';
      entryHour.value = minutesToTimeValue(rule.hour);
      entryEndHour.value = minutesToTimeValue(rule.endHour);
      repeatMode = 'weekly';
      selectedDays = new Set(rule.days);
      repeatStart.value = rule.start || dayKey;
      repeatEnd.value = rule.end || '';
      editingRuleId = rule.id;
      entryDeleteRow.style.display = 'flex';
    } else if(ent){
      entrySheetTitle.textContent = '일정 수정';
      selectedType = ent.type;
      selectedColor = ent.color || TYPE_COLOR[ent.type];
      entryMemo.value = ent.memo || '';
      entryHour.value = minutesToTimeValue(ent.hour);
      entryEndHour.value = minutesToTimeValue(ent.endHour);
      repeatMode = 'once';
      selectedDays = new Set([toDate(dayKey).getDay()]);
      editingSingleId = ent.id;
      entryDeleteRow.style.display = 'flex';
    } else {
      entrySheetTitle.textContent = '일정 추가';
      selectedType = 'facility';
      selectedColor = TYPE_COLOR.facility;
      repeatMode = 'once';
      selectedDays = new Set([toDate(dayKey).getDay()]);
      entryDeleteRow.style.display = 'none';
    }
    setTimeUI(entryHour, entryHourHour, entryHourMinute, entryHour.value);
    setTimeUI(entryEndHour, entryEndHourHour, entryEndHourMinute, entryEndHour.value);
    updateTypeUI();
    renderColorPicker();
    updateRepeatUI();
    renderWeekdayPicker();
    entryBackdrop.classList.add('open');
    pushAppHistory();
  }

  document.getElementById('entryCancel').addEventListener('click', ()=> closeLayerWithHistory(entryBackdrop));
  entryBackdrop.addEventListener('click', e=>{ if(e.target.id==='entryBackdrop') closeLayerWithHistory(entryBackdrop); });

  document.getElementById('entrySave').addEventListener('click', ()=>{
    if(!validTenMinuteTime(entryHour.value) || !validTenMinuteTime(entryEndHour.value)){
      showAlert('시간은 10분 단위로 선택해 주세요.');
      return;
    }
    const hourVal = timeValueToMinutes(entryHour.value);
    const endHourVal = timeValueToMinutes(entryEndHour.value);
    if(hourVal !== null && endHourVal !== null && endHourVal < hourVal){ showAlert('종료시간은 시작시간보다 같거나 늦게 선택해 주세요.'); return; }
    if(repeatMode==='weekly'){
      if(selectedDays.size===0){ showAlert('반복할 요일을 하나 이상 선택해 주세요.'); return; }
      if(!repeatStart.value){ showAlert('시작일을 입력해 주세요.'); return; }
      const rule = {
        id: editingRuleId || ('r'+Date.now()+Math.random().toString(36).slice(2,7)),
        type: selectedType,
        memo: entryMemo.value.trim(),
        color: selectedColor,
        hour: hourVal,
        endHour: endHourVal,
        days: [...selectedDays],
        start: repeatStart.value,
        end: repeatEnd.value || null
      };
      if(editingRuleId){
        const idx = recurring.findIndex(r=>r.id===editingRuleId);
        if(idx>=0) recurring[idx] = rule; else recurring.push(rule);
      } else {
        recurring.push(rule);
      }
      saveJSON(RECUR_KEY, recurring);
    } else {
      const key = currentEntryDate;
      if(!key){ showAlert('일정을 추가할 날짜가 없습니다.'); return; }
      const obj = {
        id: editingSingleId || ('e'+Date.now()+Math.random().toString(36).slice(2,7)),
        type: selectedType,
        memo: entryMemo.value.trim(),
        color: selectedColor,
        hour: hourVal,
        endHour: endHourVal
      };
      if(editingSingleId){
        Object.keys(singles).forEach(k=>{
          singles[k] = (singles[k]||[]).filter(e2=> e2.id!==editingSingleId || k===key);
        });
      }
      if(!singles[key]) singles[key]=[];
      const idx = singles[key].findIndex(e2=>e2.id===obj.id);
      if(idx>=0) singles[key][idx]=obj; else singles[key].push(obj);
      saveJSON(SINGLE_KEY, singles);
      selectedKey = key;
    }
    entryBackdrop.classList.remove('open');
    consumeAppHistory();
    render();
  });

  document.getElementById('entryDelete').addEventListener('click', ()=>{
    showConfirm('이 일정을 삭제할까요?', ()=>{
      if(editingRuleId){
        const rule = recurring.find(r=>r.id===editingRuleId);
        if(rule){
          const key = currentEntryDate;
          rule.skip = Array.isArray(rule.skip) ? rule.skip : [];
          if(!rule.skip.includes(key)) rule.skip.push(key);
          saveJSON(RECUR_KEY, recurring);
        }
      } else if(editingSingleId){
        const key = currentEntryDate;
        singles[key] = (singles[key]||[]).filter(e2=>e2.id!==editingSingleId);
        if(singles[key].length===0) delete singles[key];
        saveJSON(SINGLE_KEY, singles);
      }
      entryBackdrop.classList.remove('open');
      consumeAppHistory();
      render();
    });
  });

  // ---------- Nav ----------
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} render();
  });
  const quickAddBtn = document.getElementById('quickAddBtn');
  const panelQuickAdd = document.getElementById('panelQuickAdd');
  function quickAddSelected(){ openEntrySheet(selectedKey, null); }
  if(quickAddBtn) quickAddBtn.addEventListener('click', quickAddSelected);
  if(panelQuickAdd) panelQuickAdd.addEventListener('click', quickAddSelected);

  // ---------- Theme toggle ----------
  const themeBtn = document.getElementById('themeBtn');
  const THEME_KEY = 'nurseSchedule.theme.v2';
  const THEME_ORDER = ['light','gray','dark','premium'];
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t==='light' ? '☀️ 화이트' : (t==='gray' ? '◐ 그레이' : (t==='dark' ? '🌙 다크' : '✦ 프리미엄'));
    themeBtn.title = t==='light' ? '화이트 모드' : (t==='gray' ? '그레이 모드' : (t==='dark' ? '다크 모드' : '프리미엄 모드'));
    TYPE_COLOR.facility = getCss('--facility');
    TYPE_COLOR.visit = getCss('--visit');
    render();
  }
  let currentTheme = loadJSON(THEME_KEY, loadJSON('nurseSchedule.theme.v1','dark'));
  if(currentTheme === 'soft-dark') currentTheme = 'gray';
  if(!THEME_ORDER.includes(currentTheme)) currentTheme = 'light';
  applyTheme(currentTheme);
  themeBtn.addEventListener('click', ()=>{
    currentTheme = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme)+1)%THEME_ORDER.length];
    saveJSON(THEME_KEY, currentTheme);
    applyTheme(currentTheme);
  });


  // ---------- Schedule backup / restore ----------
  const backupBtn = document.getElementById('backupBtn');
  const backupSheet = document.getElementById('backupSheet');
  const backupClose = document.getElementById('backupClose');
  const backupExport = document.getElementById('backupExport');
  const backupImport = document.getElementById('backupImport');
  const backupFile = document.getElementById('backupFile');
  const BACKUP_FORMAT_VERSION = 1;
  function closeBackupSheet(){ if(backupSheet){ backupSheet.classList.remove('open'); backupSheet.setAttribute('aria-hidden','true'); } }
  function openBackupSheet(){ if(backupSheet){ backupSheet.classList.add('open'); backupSheet.setAttribute('aria-hidden','false'); } }
  if(backupBtn) backupBtn.addEventListener('click', openBackupSheet);
  if(backupClose) backupClose.addEventListener('click', closeBackupSheet);
  if(backupSheet) backupSheet.addEventListener('click', e=>{ if(e.target===backupSheet) closeBackupSheet(); });
  if(backupExport) backupExport.addEventListener('click', ()=>{
    const payload={backupFormat:'bangmun-ganho',version:BACKUP_FORMAT_VERSION,createdAt:new Date().toISOString(),singles:loadJSON(SINGLE_KEY,{}),recurring:loadJSON(RECUR_KEY,[])};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    const d=new Date(); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download='방문간호_일정백업_'+stamp+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    closeBackupSheet(); showAlert('일정 백업 파일을 저장했습니다.');
  });
  if(backupImport) backupImport.addEventListener('click', ()=>backupFile && backupFile.click());
  if(backupFile) backupFile.addEventListener('change', async ()=>{
    const file=backupFile.files && backupFile.files[0]; backupFile.value=''; if(!file) return;
    try{
      const payload=JSON.parse(await file.text());
      if(payload.backupFormat!=='bangmun-ganho' || payload.version!==BACKUP_FORMAT_VERSION || !payload.singles || !Array.isArray(payload.recurring)) throw new Error('invalid');
      const ok=window.confirm('백업 파일의 일정으로 현재 일정을 교체할까요?\n현재 일정은 백업 후 복원하는 것을 권장합니다.');
      if(!ok) return;
      localStorage.setItem(SINGLE_KEY,JSON.stringify(payload.singles));
      localStorage.setItem(RECUR_KEY,JSON.stringify(payload.recurring));
      closeBackupSheet(); alert('복원이 완료되었습니다. 앱을 새로고침합니다.'); location.reload();
    }catch(e){ alert('올바른 방문간호 일정 백업 파일이 아닙니다.'); }
  });

  // ---------- Custom confirm/alert (native dialogs can be unreliable in standalone/home-screen mode) ----------
  const confirmBackdrop = document.getElementById('confirmBackdrop');
  const confirmMsg = document.getElementById('confirmMsg');
  const confirmBtns = document.getElementById('confirmBtns');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  function showConfirm(msg, onYes){
    confirmMsg.textContent = msg;
    confirmBtns.style.display = 'flex';
    confirmYes.textContent = '삭제';
    confirmBackdrop.classList.add('open');
    pushAppHistory();
    const cleanup = ()=>{
      confirmBackdrop.classList.remove('open');
      consumeAppHistory();
      confirmYes.removeEventListener('click', yesHandler);
      confirmNo.removeEventListener('click', noHandler);
      confirmBackdrop._closeForBack = null;
    };
    const yesHandler = ()=>{ cleanup(); onYes(); };
    const noHandler = ()=>{ cleanup(); };
    confirmBackdrop._closeForBack = ()=>{ cleanup(); };
    confirmYes.addEventListener('click', yesHandler);
    confirmNo.addEventListener('click', noHandler);
  }
  function showAlert(msg){
    confirmMsg.textContent = msg;
    confirmBtns.style.display = 'none';
    confirmBackdrop.classList.add('open');
    pushAppHistory();
    const closeOnce = ()=>{
      confirmBackdrop.classList.remove('open');
      consumeAppHistory();
      confirmBtns.style.display = 'flex';
      confirmBackdrop.removeEventListener('click', closeOnce);
      confirmBackdrop._closeForBack = null;
    };
    confirmBackdrop._closeForBack = closeOnce;
    confirmBackdrop.addEventListener('click', closeOnce);
  }

  // ---------- Year/month jump ----------
  const jumpBackdrop = document.getElementById('jumpBackdrop');
  const jumpYear = document.getElementById('jumpYear');
  const jumpMonth = document.getElementById('jumpMonth');
  monthLabel.addEventListener('click', ()=>{
    jumpYear.value = viewYear;
    jumpMonth.value = viewMonth+1;
    jumpBackdrop.classList.add('open');
    pushAppHistory();
  });
  document.getElementById('jumpCancel').addEventListener('click', ()=> closeLayerWithHistory(jumpBackdrop));
  jumpBackdrop.addEventListener('click', e=>{ if(e.target.id==='jumpBackdrop') closeLayerWithHistory(jumpBackdrop); });
  document.getElementById('jumpGo').addEventListener('click', ()=>{
    const y = parseInt(jumpYear.value, 10);
    const m = parseInt(jumpMonth.value, 10);
    if(!y || y<1900 || y>2200 || !m || m<1 || m>12){
      showAlert('년도와 월을 올바르게 입력해 주세요 (예: 2026 / 9).');
      return;
    }
    viewYear = y; viewMonth = m-1;
    jumpBackdrop.classList.remove('open');
    consumeAppHistory();
    render();
  });

  // ---------- Swipe left/right to change month ----------
  let touchStartX = null, touchStartY = null;
  grid.addEventListener('contextmenu', e=>e.preventDefault());
  grid.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  grid.addEventListener('touchend', e=>{
    if(touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null; touchStartY = null;
    if(Math.abs(dx) > 55 && Math.abs(dy) < 60){
      if(dx < 0){ viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} }
      else { viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} }
      render();
    }
  }, {passive:true});

  render();
})();
</script>



<script>
(() => {
  if (!('serviceWorker' in navigator)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    if (sessionStorage.getItem('bangmun-sw-reloaded') === '1') return;
    sessionStorage.setItem('bangmun-sw-reloaded', '1');
    location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      await reg.update();
      sessionStorage.removeItem('bangmun-sw-reloaded');
    } catch (e) {}
  });
})();
</script>
